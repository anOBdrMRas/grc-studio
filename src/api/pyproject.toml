[project]
name = "grc-api"
version = "0.1.0"
description = "GRC Studio – HTTP API (all rules and all data access)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "defusedxml>=0.7",
  "anthropic>=1.0",
  "httpx>=0.28",
  "cryptography>=44",
  "nh3>=0.2.20",
]

[project.scripts]
grc-api = "grc_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grc_api"]
