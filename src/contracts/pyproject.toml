[project]
name = "grc-client"
version = "0.1.0"
description = "GRC Studio – typed client generated from openapi.json"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grc_client"]
