[project]
name = "grc-ui"
version = "0.1.0"
description = "GRC Studio – web interface (Jinja2 + HTMX, a pure client of the API)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "babel>=2.16",
  "python-multipart>=0.0.18",
  "pydantic-settings>=2.6",
  "grc-client",
  "openpyxl>=3.1.5",
  "defusedxml>=0.7",
]

[project.scripts]
grc-ui = "grc_ui.main:run"

[tool.uv.sources]
grc-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grc_ui"]
# built by `npm run build` and ignored by git, but part of the package
artifacts = ["grc_ui/static/app.css", "grc_ui/static/vendor/**", "grc_ui/static/fonts/**"]
