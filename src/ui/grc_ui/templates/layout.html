<!doctype html>
<html lang="{{ lang }}" data-theme="fidonis-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"selfRequestsOnly":true,"historyCacheSize":0,"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"^(409|412|422|428)$","swap":true,"error":false},{"code":"[45]..","swap":false,"error":true}]}'>
  <title>{% block title %}{% endblock %}GRC Studio</title>
  <link rel="icon" href="{{ asset_url('favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ asset_url('app.css') }}">
  {% block head_styles %}{% endblock %}
  <script src="{{ asset_url('js/init.js') }}"></script>
  <script src="{{ asset_url('vendor/htmx.min.js') }}" defer></script>
  <script src="{{ asset_url('vendor/alpine-csp.min.js') }}" defer></script>
  <script src="{{ asset_url('js/app.js') }}" defer></script>
  {% block head_scripts %}{% endblock %}
</head>
<body class="min-h-screen bg-base-200 text-base-content font-sans" data-msg-unreachable="{{ _('The server cannot be reached. Please try again.') }}" data-msg-too-large="{{ _('Too large to save. Please shrink or remove large images.') }}"{% block body_attrs %}{% endblock %}>
{% block body %}{% endblock %}
<div id="toasts" class="toast toast-end toast-bottom z-50" aria-live="polite"></div>
</body>
</html>
