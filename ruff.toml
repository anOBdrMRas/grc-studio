target-version = "py312"
line-length = 100
extend-exclude = ["src/ui/node_modules", "src/api/grc_api/migrations/versions"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "RET", "SIM", "ASYNC", "S", "RUF", "PT"]
ignore = [
  "E501",    # the formatter decides line length
  "S101",    # assert in tests
  "B008",    # FastAPI dependencies in defaults
  "RUF001", "RUF002", "RUF003",  # German typography in texts (–, „“)
  "N818",    # exception names are part of the domain language (NotSignedIn)
]

[lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
"scripts/**" = ["S603", "S607"]
"src/contracts/grc_client/*.py" = ["ALL"]  # generated by scripts/generate_client.py (formatted, not linted)

[lint.isort]
known-first-party = ["grc_api", "grc_ui", "grc_client"]

[format]
quote-style = "double"
