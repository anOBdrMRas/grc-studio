# Single entry point: /api, /health and the API docs go to the API, everything else to the interface.
# TLS is terminated in front of this proxy (company load balancer) or added here.
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location /api/ { proxy_pass http://api:8000; }
    location /health/ { proxy_pass http://api:8000; }
    location = /openapi.json { proxy_pass http://api:8000; }
    location /docs { proxy_pass http://api:8000; }

    location /static/ {
        proxy_pass http://ui:8001;
        expires 7d;
    }
    location / { proxy_pass http://ui:8001; }
}
