name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  checks:
    name: lint, types, contracts, wording
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync
      - run: uv run yamllint .
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/generate_client.py --check
      - run: uv run python scripts/i18n.py missing

  tests:
    name: pytest (PostgreSQL 16)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: grc_test
          POSTGRES_USER: grc
          POSTGRES_PASSWORD: grc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grc -d grc_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://grc:grc@localhost:5432/grc_test

  stack:
    name: compose stack + browser tests
    runs-on: ubuntu-24.04
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - name: configuration with generated secrets
        run: python3 scripts/init_env.py
      - name: build and start db, api, ui, proxy
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: the stack answers
        run: |
          curl -fsS http://127.0.0.1:8080/health/ready
          curl -fsS http://127.0.0.1:8080/login | grep -q "GRC"
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e tests/e2e -q
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: check format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|refactor|test|ci|chore|perf|build|revert)(\([a-z0-9-]+\))?!?: [a-z].*[^.]$' || {
            echo "PR title must look like 'feat(scope): add something' – got: $TITLE"; exit 1; }
