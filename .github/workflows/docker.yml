name: docker

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write  # keyless signing

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [api, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        name: image name (ghcr needs lower case)
        env:
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.component }}
        run: echo "image=ghcr.io/${OWNER,,}/grc-studio-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - uses: sigstore/cosign-installer@v3
      - name: sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.name.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
