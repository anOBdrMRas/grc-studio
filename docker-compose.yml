# GRC Studio: database, API, interface and a proxy as the single entry point.
#   cp .env.example .env   (or: uv run python scripts/init_env.py)
#   docker compose up -d --build
# The application is then reachable on http://localhost:8080 (only from this machine).
name: grc-studio

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: grc
      POSTGRES_USER: grc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc -d grc"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${API_IMAGE:-grc-studio-api:local}
    build: { context: ., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://grc:${POSTGRES_PASSWORD}@db:5432/grc
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      DEMO_LOGIN: ${DEMO_LOGIN:-true}
      SEED_DEMO_ON_EMPTY: ${SEED_DEMO_ON_EMPTY:-true}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  ui:
    image: ${UI_IMAGE:-grc-studio-ui:local}
    build: { context: ., dockerfile: docker/ui.Dockerfile }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      UI_API_URL: http://api:8000
      UI_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      UI_DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-de}

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      ui: { condition: service_healthy }
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # loopback only; to publish in the network set BIND_ADDRESS=0.0.0.0 (TLS in front!)
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"

volumes:
  db-data:
